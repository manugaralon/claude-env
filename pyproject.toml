[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-env"
version = "0.1.0"
description = "Generate calibrated Claude Code environments from project specs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.24",
    "rich>=14.0",
]

[project.scripts]
claude-env = "claude_env.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["claude_env"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
